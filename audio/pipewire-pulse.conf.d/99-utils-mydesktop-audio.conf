# utils-mydesktop audio: pipewire-pulse's threads ahead of everything else
# on the CPU. See audio/README.md.
#
# module.rt.args overrides the arguments of every libpipewire-module-rt in
# this process: pipewire-pulse.conf's own and the one asahi-audio's
# 99-asahi.conf adds (its uclamp settings stay). The priorities need the
# real-time limits of the pipewire group; through RTKit they stop at 20
# and nice -15.
module.rt.args = {
    # The data loop that serves PulseAudio clients: browsers, Electron
    # apps and most other programs. Below the server's 88 like every
    # PipeWire client, above every kernel interrupt thread (50) and every
    # other program. PipeWire's default, set here so that both module-rt
    # instances agree.
    rt.prio    = 83
    # The main thread, which handles the PulseAudio protocol: the lowest
    # nice level the pipewire group allows (PipeWire's is -11).
    nice.level = -19
}
