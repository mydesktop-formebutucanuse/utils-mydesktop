# wmutils audio: the speaker DSP with zeroramp in front, so that a
# program that stops or starts its sound mid-wave does not make the
# speakers click. See audio/README.md.
#
# asahi-audio's 99-asahi.conf has WirePlumber run the speaker DSP from
# /usr/share/asahi-audio/j314/graph.json. install.sh writes a copy of that
# graph with PipeWire's zeroramp in front of both inputs, and the Portage
# hook it installs writes the copy again whenever asahi-audio is installed
# or updated.
#
# Another rule for the speakers would start a second DSP next to
# asahi-audio's, so this replaces asahi-audio's rules (override.) with the
# J314's two: the speakers with the copy, and the microphones as
# asahi-audio has them. WirePlumber reads the drop-ins in /usr/share before
# those in /etc, so this one comes after asahi-audio's.
override.node.software-dsp.rules = [
    {
        matches = [
            { api.alsa.path = "hw:AppleJ314,1" }
        ]
        actions = {
            create-filter = {
                filter-path = "/usr/local/share/wmutils/audio/j314-graph.json"
                hide-parent = true
            }
        }
    }
    {
        matches = [
            { api.alsa.path = "hw:AppleJ314HPAI,0" }
        ]
        actions = {
            create-filter = {
                filter-path = "/usr/share/asahi-audio/j314/mic.json"
                hide-parent = true
            }
        }
    }
]
