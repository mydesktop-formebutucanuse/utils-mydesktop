# utils-mydesktop audio: the PipeWire server's threads ahead of everything
# else on the CPU, and a speaker DSP that keeps running when playback stops,
# so that the speakers do not pop. See audio/README.md.
#
# module.rt.args overrides the arguments of every libpipewire-module-rt in
# this process: pipewire.conf's own and the one asahi-audio's 99-asahi.conf
# adds (its uclamp settings stay). The priorities need the real-time limits
# of the pipewire group; through RTKit they stop at 20 and nice -15.
module.rt.args = {
    # The data loop: the graph's clock and the ALSA devices. Above every
    # kernel interrupt thread (50) and every other program. PipeWire's
    # default, set here so that both module-rt instances agree.
    rt.prio    = 88
    # The main thread, which sets up streams, devices and links: the
    # lowest nice level the pipewire group allows (PipeWire's is -11).
    nice.level = -19
}

# The speaker DSP is asahi-audio's filter-chain inside WirePlumber, from the
# "MacBook Pro J314 Speakers" sink to the hidden RawSpeakers device. About
# 26 ms of sound is inside it at any time (1264 samples at 48 kHz).
#
# PipeWire pauses a node when it goes idle. When playback stops, both DSP
# nodes go idle, and when its output is paused filter-chain drops what is
# queued and resets the DSP. The 26 ms still inside are cut off mid-wave,
# which pops, and the next start goes through a freshly reset DSP, which
# pops again. With pause-on-idle off, both nodes keep running on silence
# while idle and the sound drains out. WirePlumber still suspends the
# speakers 5 s after playback stops. Both nodes need it: the output runs
# only when the input triggers it.
#
# The server applies node.rules whenever a node's properties are set, so
# they override what the two streams got from asahi-audio's graph.json,
# which takes no drop-ins.
node.rules = [
    {
        matches = [
            { node.name = "audio_effect.j314-convolver" }
            { node.name = "effect_output.j314-convolver" }
        ]
        actions = {
            update-props = {
                node.pause-on-idle = false
            }
        }
    }
]
