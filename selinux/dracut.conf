# wmutils: installed as /etc/dracut.conf.d/wmutils-selinux.conf
# by selinux/install.sh. See selinux/README.md.
#
# The initramfs loads the SELinux policy before it starts the real init.
# OpenRC's and systemd's init load it themselves; s6-linux-init does not,
# and without a policy the kernel's SELinux allows everything and logs
# nothing. dracut leaves the module out unless it is named here.
add_dracutmodules+=" selinux "
