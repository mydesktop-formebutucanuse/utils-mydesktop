# wmutils: installed as /etc/modprobe.d/wmutils-appledrm.conf
# by kernel/install.sh. The kernel build's dracut run copies it into the
# initramfs, where appledrm loads; it takes effect at the next boot.
#
# force_vrr=1   Adaptive Sync / ProMotion (VRR) on displays that support it.
#               Needs 0004-drm-apple-adaptive-sync-promotion.patch; a kernel
#               without it ignores the option with a warning in dmesg.
# show_notch=1  The built-in panel's full height, the strip on both sides of
#               the camera notch included (3024x1964 instead of 3024x1890 on
#               the 14-inch MacBook Pro).
options appledrm force_vrr=1 show_notch=1
