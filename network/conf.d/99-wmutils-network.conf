# wmutils network: what this machine tells a network about itself.
# network/install.sh installs it in /etc/NetworkManager/conf.d. These are
# the defaults for every connection profile that does not set the property
# itself; a profile takes them the next time it connects. See
# network/README.md.
[connection]
# No hostname in DHCP requests: the router or hotspot lists the machine
# without a name.
ipv4.dhcp-send-hostname=0
ipv6.dhcp-send-hostname=0
# Temporary IPv6 addresses for outgoing connections, which change every
# day, instead of one address that stays the same.
ipv6.ip6-privacy=2
# A made-up MAC address for each Wi-Fi network, the same one every time on
# that network, instead of the adapter's own. Take this line out for a
# network that lets in only MAC addresses it knows.
wifi.cloned-mac-address=stable
