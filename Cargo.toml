[package]
name = "mediakeyd"
version = "0.1.0"
edition = "2024"
description = "Run commands for media keys without grabbing them (XInput2 raw key events)"
license = "GPL-3.0-or-later"
repository = "https://github.com/mydesktop-formebutucanuse/mediakeyd"
readme = "README.md"

# No dependencies: libX11 and libXi are called directly (src/xlib.rs).

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
