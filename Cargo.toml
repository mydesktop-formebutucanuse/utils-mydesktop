[workspace]
members = ["autobrightd", "ledclock", "mediakeyd", "scd"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/mydesktop-formebutucanuse/wmutils"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
